[package]
name = "voxd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vox app (voxd.exe: tray + settings window + dictation daemon) and diagnostics CLI (vox.exe)."
publish = false
build = "build.rs"

[lib]
name = "voxd"
path = "src/lib.rs"

[[bin]]
name = "voxd"
path = "src/bin/voxd.rs"

[[bin]]
name = "vox"
path = "src/bin/vox.rs"

[dependencies]
vox-core = { path = "../vox-core" }
vox-engine-whisper = { path = "../vox-engine-whisper" }
vox-platform-win = { path = "../vox-platform-win" }
crossbeam-channel.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
hound.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true

[build-dependencies]
tauri-build.workspace = true

[features]
cuda = ["vox-engine-whisper/cuda"]
vulkan = ["vox-engine-whisper/vulkan"]
