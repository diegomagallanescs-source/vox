[package]
name = "vox-engine-whisper"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "whisper.cpp speech-to-text engine for Vox (via whisper-rs)."

[dependencies]
vox-core = { path = "../vox-core" }
whisper-rs.workspace = true
thiserror.workspace = true
num_cpus.workspace = true

[features]
default = []
# GPU backends are compiled into whisper.cpp at build time. Each needs its SDK installed.
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]
# OpenMP threading for the CPU backend.
openmp = ["whisper-rs/openmp"]
