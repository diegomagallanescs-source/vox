[workspace]
resolver = "2"
members = [
    "crates/vox-core",
    "crates/vox-engine-whisper",
    "crates/vox-platform-win",
    "crates/vox-bench",
    "crates/voxd",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/diegomagallanescs-source/vox"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
crossbeam-channel = "0.5"
tracing = "0.1"
whisper-rs = "0.16"
hound = "3.5"
num_cpus = "1"
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Media_Audio",
    "Win32_Devices_FunctionDiscovery",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Console",
    "Win32_System_Registry",
] }
# Direct dependency (same version the `windows` crate pins) so the `#[implement]` macro's
# `windows_core::` paths resolve. Must stay in lockstep with `windows`.
windows-core = "0.62"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-build = "2"

# Small, fast binaries for the daemon; debug builds stay default for iteration speed.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
